# ==========================================================
# SelectMyFlight Backend - MySQL Production Profile
# Run with: --spring.profiles.active=mysql
# ==========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/selectmyflight_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
