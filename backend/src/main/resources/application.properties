# ==========================================================
# SelectMyFlight Backend Configuration
# Default Profile: Runs out-of-the-box with H2 in-memory DB
# ==========================================================

server.port=${PORT:8080}
spring.application.name=selectmyflight-backend

# In-Memory Database for Instant Preview & Testing
spring.datasource.url=jdbc:h2:mem:selectmyflight_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS Settings (Allow React frontend)
cors.allowed-origins=http://localhost:5173,http://localhost:3000

